name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (no model extras: tests marked `models` are skipped)
        run: pip install -e ".[tokens,pdf,dev]"
      - name: Unit tests and the answer-gate table
        run: scripts/check.sh
