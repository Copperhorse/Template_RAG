[project]
name = "rag-template"
version = "0.1.0"
description = "A template RAG: bi-encoder + BM25 + RRF + cross-encoder retrieval, source-quote gates, AST-aware chunking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.16.0",         # any OpenAI-compatible server (llama.cpp, vLLM, Ollama, OpenAI, ...)
    "httpx>=0.27",
    "rapidfuzz>=3.14.3",      # quote location and near-duplicate questions
    "json-repair>=0.58.5",    # small models emit broken JSON
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.12.0"]                  # exact token counts (falls back to len/4)
local = ["sentence-transformers>=5.2.2"]       # bge embedder, NLI validator, reranker
chroma = ["chromadb>=1.5.0"]                   # persistent vector store
pdf = ["docling>=2.71.0", "pymupdf>=1.24", "pymupdf4llm>=1.0"]     # PDF -> Markdown
ui = ["streamlit>=1.40", "pandas>=2"]               # `rag ui`
dev = ["pytest>=8", "playwright>=1.40"]          # playwright only for browser screenshots of the UI
all = ["rag-template[tokens,local,chroma,pdf,ui]"]

[project.scripts]
rag = "rag_template.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["models: needs sentence-transformers / network (deselect with -m 'not models')"]
